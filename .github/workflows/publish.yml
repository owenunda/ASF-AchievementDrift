name: Plugin-publish

on: [pull_request, push, workflow_dispatch]

env:
  CONFIGURATION: Release
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SDK_VERSION: 11.0
  # ASF V7 broke the plugin API: every release carries a {PluginName}-V7.zip built from this commit and a {PluginName}-V6.zip
  # built from the last V6 source (with the version of this commit), so ASF picks the right one and switches when it updates
  DOTNET_SDK_VERSION_V6: 10.0
  V6_SOURCE_REF: 1.4.0.0
  GPG_PRIVATE_KEY: ${{ secrets.ARCHIBOT_GPG_PRIVATE_KEY }} # Optional, if secret not provided, will skip signing SHA512SUMS with GPG key. You can specify your own credentials if you'd like to, simply change ARCHIBOT_GPG_PRIVATE_KEY here to the one you want to use

permissions:
  contents: read

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    outputs:
      PLUGIN_NAME: ${{ steps.plugin-name.outputs.info }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        show-progress: false
        submodules: recursive

    - name: Setup .NET Core
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

    - name: Verify .NET Core
      run: dotnet --info

    - name: Parse plugin name from Directory.Build.props
      id: plugin-name
      uses: mavrosxristoforos/get-xml-info@219e509082288b248df8a825f6c9abb323ef4e06 # 2.2.1
      with:
        xml-file: 'Directory.Build.props'
        xpath: '//PluginName'

    - name: Publish plugin on Unix
      if: startsWith(matrix.os, 'macos-') || startsWith(matrix.os, 'ubuntu-')
      env:
        PLUGIN_NAME: ${{ steps.plugin-name.outputs.info }}
      shell: sh
      run: |
        set -eu

        dotnet publish "$PLUGIN_NAME" -c "$CONFIGURATION" -o "out/plugin/${PLUGIN_NAME}" -p:ContinuousIntegrationBuild=true -p:TargetLatestRuntimePatch=false -p:UseAppHost=false --nologo

        # By default use fastest compression
        seven_zip_args="-mx=1"
        zip_args="-1"

        # Include extra logic for builds marked for release
        case "$GITHUB_REF" in
            "refs/tags/"*)
                # Tweak compression args for release publishing
                seven_zip_args="-mx=9 -mfb=258 -mpass=15"
                zip_args="-9"
                ;;
        esac

        # Create the final zip file
        case "$(uname -s)" in
            "Darwin")
                # We prefer to use zip on OS X as 7z implementation on that OS doesn't handle file permissions (chmod +x)
                if command -v zip >/dev/null; then
                    (
                        cd "${GITHUB_WORKSPACE}/out/plugin/${PLUGIN_NAME}"
                        zip -q -r $zip_args "../../${PLUGIN_NAME}-V7.zip" .
                    )
                else
                    7z a -bd -slp -tzip -mm=Deflate $seven_zip_args "out/${PLUGIN_NAME}-V7.zip" "${GITHUB_WORKSPACE}/out/plugin/${PLUGIN_NAME}/*"
                fi
                ;;
            *)
                if command -v 7z >/dev/null; then
                    7z a -bd -slp -tzip -mm=Deflate $seven_zip_args "out/${PLUGIN_NAME}-V7.zip" "${GITHUB_WORKSPACE}/out/plugin/${PLUGIN_NAME}/*"
                else
                    (
                        cd "${GITHUB_WORKSPACE}/out/plugin/${PLUGIN_NAME}"
                        zip -q -r $zip_args "../../${PLUGIN_NAME}-V7.zip" .
                    )
                fi
                ;;
        esac

    - name: Publish plugin on Windows
      if: startsWith(matrix.os, 'windows-')
      env:
        PLUGIN_NAME: ${{ steps.plugin-name.outputs.info }}
      shell: pwsh
      run: |
        Set-StrictMode -Version Latest
        $ErrorActionPreference = 'Stop'
        $ProgressPreference = 'SilentlyContinue'

        Set-Location "$env:GITHUB_WORKSPACE"

        dotnet publish "$env:PLUGIN_NAME" -c "$env:CONFIGURATION" -o "out\plugin\$env:PLUGIN_NAME" -p:ContinuousIntegrationBuild=true -p:TargetLatestRuntimePatch=false -p:UseAppHost=false --nologo

        if ($LastExitCode -ne 0) {
            throw "Last command failed."
        }

        # By default use fastest compression
        $compressionArgs = '-mx=1'

        # Include extra logic for builds marked for release
        if ($env:GITHUB_REF -like 'refs/tags/*') {
            # Tweak compression args for release publishing
            $compressionArgs = '-mx=9', '-mfb=258', '-mpass=15'
        }

        # Create the final zip file
        7z a -bd -slp -tzip -mm=Deflate $compressionArgs "out\$env:PLUGIN_NAME-V7.zip" "$env:GITHUB_WORKSPACE\out\plugin\$env:PLUGIN_NAME\*"

        if ($LastExitCode -ne 0) {
            throw "Last command failed."
        }

    - name: Upload plugin artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        compression-level: 1
        if-no-files-found: error
        name: ${{ matrix.os }}_${{ steps.plugin-name.outputs.info }}
        path: out/${{ steps.plugin-name.outputs.info }}-V7.zip

  publish-v6:
    runs-on: ubuntu-latest

    outputs:
      PLUGIN_NAME: ${{ steps.plugin-name.outputs.info }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        show-progress: false

    - name: Checkout V6 source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: v6
        ref: ${{ env.V6_SOURCE_REF }}
        show-progress: false
        submodules: recursive

    - name: Setup .NET Core
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: ${{ env.DOTNET_SDK_VERSION_V6 }}

    - name: Parse plugin name from Directory.Build.props
      id: plugin-name
      uses: mavrosxristoforos/get-xml-info@219e509082288b248df8a825f6c9abb323ef4e06 # 2.2.1
      with:
        xml-file: 'Directory.Build.props'
        xpath: '//PluginName'

    - name: Parse plugin version from Directory.Build.props
      id: plugin-version
      uses: mavrosxristoforos/get-xml-info@219e509082288b248df8a825f6c9abb323ef4e06 # 2.2.1
      with:
        xml-file: 'Directory.Build.props'
        xpath: '//Version'

    - name: Publish V6 plugin
      env:
        PLUGIN_NAME: ${{ steps.plugin-name.outputs.info }}
        PLUGIN_VERSION: ${{ steps.plugin-version.outputs.info }}
      shell: sh
      run: |
        set -eu

        # The SDK 10 must build the V6 source: pin it there so a newer preinstalled SDK is not picked up
        printf '{ "sdk": { "version": "%s.100", "rollForward": "latestFeature" } }' "$DOTNET_SDK_VERSION_V6" > v6/global.json

        # Same version as this release, otherwise ASF V6 would keep seeing a newer version and reinstall it every day
        (
            cd v6
            dotnet publish "$PLUGIN_NAME" -c "$CONFIGURATION" -o "../out/plugin-v6/${PLUGIN_NAME}" -p:Version="$PLUGIN_VERSION" -p:ContinuousIntegrationBuild=true -p:TargetLatestRuntimePatch=false -p:UseAppHost=false --nologo
        )

        (
            cd "out/plugin-v6/${PLUGIN_NAME}"
            zip -q -r -9 "../../${PLUGIN_NAME}-V6.zip" .
        )

    - name: Upload V6 plugin artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        compression-level: 1
        if-no-files-found: error
        name: V6_${{ steps.plugin-name.outputs.info }}
        path: out/${{ steps.plugin-name.outputs.info }}-V6.zip

  release:
    if: ${{ github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/') }}
    needs: [publish, publish-v6]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        show-progress: false

    - name: Download plugin artifact from ubuntu-latest
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ubuntu-latest_${{ needs.publish.outputs.PLUGIN_NAME }}
        path: out

    - name: Download V6 plugin artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: V6_${{ needs.publish-v6.outputs.PLUGIN_NAME }}
        path: out

    - name: Import GPG key for signing
      uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
      if: ${{ env.GPG_PRIVATE_KEY != null }}
      with:
        gpg_private_key: ${{ env.GPG_PRIVATE_KEY }}

    - name: Generate SHA-512 checksums and signature
      shell: sh
      run: |
        set -eu

        (
            cd "out"

            sha512sum *.zip > SHA512SUMS

            if [ -n "$GPG_PRIVATE_KEY" ]; then
                gpg -a -b -o SHA512SUMS.sign SHA512SUMS
            fi
        )

    - name: Upload SHA512SUMS
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        compression-level: 1
        if-no-files-found: error
        name: SHA512SUMS
        path: out/SHA512SUMS

    - name: Upload SHA512SUMS.sign
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ env.GPG_PRIVATE_KEY != null }}
      with:
        compression-level: 1
        if-no-files-found: error
        name: SHA512SUMS.sign
        path: out/SHA512SUMS.sign

    - name: Create GitHub release
      uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
      with:
        allowUpdates: true
        artifactErrorsFailBuild: true
        artifacts: "out/*"
        bodyFile: .github/RELEASE_TEMPLATE.md
        immutableCreate: true
        makeLatest: true
        name: ${{ needs.publish.outputs.PLUGIN_NAME }} V${{ github.ref_name }}
        prerelease: false
        token: ${{ secrets.GITHUB_TOKEN }}
        updateOnlyUnreleased: true
